<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- One restrained 22% corner profile, uniformly scaled for all cards. -->
    <path id="card" d="M220 0H780C901.5 0 1000 98.5 1000 220V780C1000 901.5 901.5 1000 780 1000H220C98.5 1000 0 901.5 0 780V220C0 98.5 98.5 0 220 0Z"/>
    <linearGradient id="rear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C2B5F3"/>
      <stop offset="1" stop-color="#A793E2"/>
    </linearGradient>
    <linearGradient id="middle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B5CBF2"/>
      <stop offset="1" stop-color="#8FAAE2"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8EDF7"/>
      <stop offset="1" stop-color="#D8E0EF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#25325C" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Scale the entire foreground around its visual center. -->
  <g transform="translate(-60 -60) scale(1.12)">
  <g filter="url(#shadow)">
    <use href="#card" transform="translate(446 230) scale(.36)" fill="url(#rear)"/>
    <use href="#card" transform="translate(318 350) scale(.36)" fill="url(#middle)"/>
    <use href="#card" transform="translate(190 470) scale(.36)" fill="url(#front)" stroke="#E1E4EC" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  </g>

  <g fill="#5367A7" opacity=".72">
    <rect x="698" y="326" width="66" height="14" rx="7"/>
    <rect x="698" y="376" width="66" height="14" rx="7"/>
    <rect x="570" y="446" width="66" height="14" rx="7"/>
    <rect x="570" y="496" width="66" height="14" rx="7"/>
  </g>

  <g transform="translate(0 -30)">
  <g fill="none" stroke="#465A98" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M304 590C282 590 282 612 282 630V650C282 669 270 680 254 680C270 680 282 691 282 710V730C282 748 282 770 304 770"/>
    <path d="M436 590C458 590 458 612 458 630V650C458 669 470 680 486 680C470 680 458 691 458 710V730C458 748 458 770 436 770"/>
  </g>
  <g fill="#465A98">
    <rect x="330" y="628" width="80" height="14" rx="7"/>
    <rect x="330" y="673" width="80" height="14" rx="7"/>
    <rect x="330" y="718" width="80" height="14" rx="7"/>
  </g>
  </g>
  </g>
</svg>
