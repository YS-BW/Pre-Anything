<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Pre-Anything app icon</title>
  <desc>Three matching squircles represent Markdown, JSON, and YAML previews.</desc>

  <defs>
    <!--
      Every rounded surface reuses this exact normalized continuous-curvature
      path. Only uniform scale and translation change, so all corner profiles
      are mathematically identical.
    -->
    <path id="squircle" d="M308 0H692C862.1 0 1000 137.9 1000 308V692C1000 862.1 862.1 1000 692 1000H308C137.9 1000 0 862.1 0 692V308C0 137.9 137.9 0 308 0Z"/>
    <path id="card" d="M220 0H780C901.5 0 1000 98.5 1000 220V780C1000 901.5 901.5 1000 780 1000H220C98.5 1000 0 901.5 0 780V220C0 98.5 98.5 0 220 0Z"/>

    <linearGradient id="outer-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#FAFBFD"/>
      <stop offset="1" stop-color="#F2F4F8"/>
    </linearGradient>
    <linearGradient id="rear-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C1B4F2"/>
      <stop offset="0.55" stop-color="#B5A3EC"/>
      <stop offset="1" stop-color="#A997E1"/>
    </linearGradient>
    <linearGradient id="middle-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B2C9F1"/>
      <stop offset="0.56" stop-color="#9EB9EA"/>
      <stop offset="1" stop-color="#91ABE2"/>
    </linearGradient>
    <linearGradient id="front-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8EDF7"/>
      <stop offset="1" stop-color="#D8E0EF"/>
    </linearGradient>

    <filter id="outer-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#151924" flood-opacity="0.18"/>
    </filter>
    <filter id="card-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#25325C" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- The actual icon starts here; the area outside the outer squircle is transparent. -->
  <g id="app-icon">
    <use href="#squircle"
         transform="translate(50 50) scale(0.924)"
         fill="url(#outer-surface)"
         stroke="#D9DEE8"
         stroke-width="2"
         vector-effect="non-scaling-stroke"
         filter="url(#outer-shadow)"/>

    <g transform="translate(-60 -60) scale(1.12)">
    <!-- Identical 360 × 360 cards on a precise 128 × -120 px rhythm. -->
    <g id="documents" filter="url(#card-shadow)">
      <use href="#card" transform="translate(446 230) scale(0.36)" fill="url(#rear-surface)"/>
      <use href="#card" transform="translate(318 350) scale(0.36)" fill="url(#middle-surface)"/>
      <use href="#card"
           transform="translate(190 470) scale(0.36)"
           fill="url(#front-surface)"
           stroke="#E1E4EC"
           stroke-width="1.5"
           vector-effect="non-scaling-stroke"/>
    </g>

    <!-- Rear document marks: equal lengths, equal spacing, one color family. -->
    <g fill="#5367A7" opacity="0.72">
      <rect x="698" y="326" width="66" height="14" rx="7"/>
      <rect x="698" y="376" width="66" height="14" rx="7"/>
      <rect x="570" y="446" width="66" height="14" rx="7"/>
      <rect x="570" y="496" width="66" height="14" rx="7"/>
    </g>

    <!-- Front structured-document mark, optically centered in its card. -->
    <g transform="translate(0 -30)">
    <g id="front-mark" fill="none" stroke="#465A98" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 304 590 C 282 590 282 612 282 630 L 282 650 C 282 669 270 680 254 680 C 270 680 282 691 282 710 L 282 730 C 282 748 282 770 304 770"/>
      <path d="M 436 590 C 458 590 458 612 458 630 L 458 650 C 458 669 470 680 486 680 C 470 680 458 691 458 710 L 458 730 C 458 748 458 770 436 770"/>
    </g>
    <g fill="#465A98">
      <rect x="330" y="628" width="80" height="14" rx="7"/>
      <rect x="330" y="673" width="80" height="14" rx="7"/>
      <rect x="330" y="718" width="80" height="14" rx="7"/>
    </g>
    </g>
    </g>
  </g>
</svg>
