name: PreAnything

options:
  bundleIdPrefix: com.lixinlv
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.8.0
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 6.2.2
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    exactVersion: 1.7.3
  BeautifulMermaid:
    url: https://github.com/lukilabs/beautiful-mermaid-swift.git
    exactVersion: 1.0.4
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit.git
    exactVersion: 0.6.0

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  PreviewKit:
    type: library.static
    platform: macOS
    sources:
      - Sources/PreviewKit
    dependencies:
      - package: Markdown
      - package: Yams
      - sdk: AppKit.framework
      - sdk: Quartz.framework
    settings:
      base:
        PRODUCT_NAME: PreviewKit
        PRODUCT_MODULE_NAME: PreviewKit

  PreAnything:
    type: application
    platform: macOS
    sources:
      - Sources/PreAnything
      - path: Design/PreAnything.icon
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: Sources/PreAnything/Info.plist
      properties:
        CFBundleDisplayName: Pre-Anything
        CFBundleName: Pre-Anything
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "14"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Pre-Anything"
        PreAnythingAppGroupIdentifier: $(PREANYTHING_APP_GROUP_IDENTIFIER)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.lixinlv.preanything.source-code
            UTTypeDescription: Pre-Anything Source Code
            UTTypeConformsTo:
              - public.source-code
            UTTypeTagSpecification:
              public.filename-extension:
                - jsx
                - mjs
                - cjs
                - ts
                - tsx
                - mts
                - cts
                - go
                - rs
                - kt
                - kts
                - cs
                - pyi
                - pyw
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.lixinlv.preanything.toml
            UTTypeDescription: TOML Configuration
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension: [toml]
          - UTTypeIdentifier: com.lixinlv.preanything.jsonc
            UTTypeDescription: JSON with Comments
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension: [jsonc]
          - UTTypeIdentifier: com.lixinlv.preanything.json5
            UTTypeDescription: JSON5
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension: [json5]
          - UTTypeIdentifier: com.lixinlv.preanything.dotenv
            UTTypeDescription: Environment Configuration
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension: [env]
          - UTTypeIdentifier: com.lixinlv.preanything.ini
            UTTypeDescription: INI Configuration
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension: [ini, cfg]
          - UTTypeIdentifier: com.lixinlv.preanything.properties
            UTTypeDescription: Properties Configuration
            UTTypeConformsTo: [public.text]
            UTTypeTagSpecification:
              public.filename-extension: [properties, conf]
          - UTTypeIdentifier: com.lixinlv.preanything.notebook
            UTTypeDescription: Jupyter Notebook
            UTTypeConformsTo: [public.json, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [ipynb]
    entitlements:
      path: Sources/PreAnything/PreAnything.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(PREANYTHING_APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lixinlv.PreAnything
        PRODUCT_NAME: Pre-Anything
        ASSETCATALOG_COMPILER_APPICON_NAME: PreAnything
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: PreviewKit
      - target: MarkdownPreview
        embed: true
        codeSign: true
      - target: JSONPreview
        embed: true
        codeSign: true
      - target: YAMLPreview
        embed: true
        codeSign: true
      - target: SourceCodePreview
        embed: true
        codeSign: true
      - target: ConfigPreview
        embed: true
        codeSign: true
      - target: TablePreview
        embed: true
        codeSign: true
      - target: XMLPreview
        embed: true
        codeSign: true
      - target: NotebookPreview
        embed: true
        codeSign: true

  MarkdownPreview:
    templates: [QuickLookExtension]
    sources:
      - Sources/MarkdownPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lixinlv.PreAnything.MarkdownPreview
        PRODUCT_NAME: Markdown Preview
    info:
      path: Sources/MarkdownPreview/Info.plist
      properties:
        CFBundleDisplayName: Markdown Preview
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "14"
        PreAnythingAppGroupIdentifier: $(PREANYTHING_APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - net.daringfireball.markdown
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    dependencies:
      - package: SwiftMath
      - package: BeautifulMermaid
    postBuildScripts:
      - name: Prune unused SwiftMath fonts
        basedOnDependencyAnalysis: false
        script: /bin/sh "$SRCROOT/Scripts/prune-swiftmath-fonts.sh"

  JSONPreview:
    templates: [QuickLookExtension]
    sources:
      - Sources/JSONPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lixinlv.PreAnything.JSONPreview
        PRODUCT_NAME: JSON Preview
    info:
      path: Sources/JSONPreview/Info.plist
      properties:
        CFBundleDisplayName: JSON Preview
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "14"
        PreAnythingAppGroupIdentifier: $(PREANYTHING_APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - public.json
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false

  YAMLPreview:
    templates: [QuickLookExtension]
    sources:
      - Sources/YAMLPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lixinlv.PreAnything.YAMLPreview
        PRODUCT_NAME: YAML Preview
    info:
      path: Sources/YAMLPreview/Info.plist
      properties:
        CFBundleDisplayName: YAML Preview
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "14"
        PreAnythingAppGroupIdentifier: $(PREANYTHING_APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - public.yaml
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false

  SourceCodePreview:
    templates: [QuickLookExtension]
    sources:
      - Sources/SourceCodePreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lixinlv.PreAnything.SourceCodePreview
        PRODUCT_NAME: Source Code Preview
    info:
      path: Sources/SourceCodePreview/Info.plist
      properties:
        CFBundleDisplayName: Source Code Preview
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "14"
        PreAnythingAppGroupIdentifier: $(PREANYTHING_APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              # Quick Look does not consistently route concrete language UTIs
              # through the public.source-code parent on macOS 27. Register the
              # system language types explicitly so the extension wins over the
              # built-in public.plain-text preview.
              - public.swift-source
              - public.objective-c-source
              - public.objective-c-plus-plus-source
              - public.c-source
              - public.c-header
              - public.c-plus-plus-source
              - public.c-plus-plus-header
              - com.sun.java-source
              - com.netscape.javascript-source
              - com.microsoft.typescript
              - public.python-script
              - public.ruby-script
              - public.shell-script
              - public.bash-script
              - public.zsh-script
              - org.iso.sql
              - public.css
              - com.lixinlv.preanything.source-code
              - public.source-code
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false

  ConfigPreview:
    templates: [QuickLookExtension]
    sources:
      - Sources/ConfigPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lixinlv.PreAnything.ConfigPreview
        PRODUCT_NAME: Config Preview
    info:
      path: Sources/ConfigPreview/Info.plist
      properties:
        CFBundleDisplayName: Config Preview
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "14"
        PreAnythingAppGroupIdentifier: $(PREANYTHING_APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - com.lixinlv.preanything.toml
              - com.lixinlv.preanything.jsonc
              - com.lixinlv.preanything.json5
              - com.lixinlv.preanything.dotenv
              - com.lixinlv.preanything.ini
              - com.lixinlv.preanything.properties
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    dependencies:
      - package: TOMLKit

  TablePreview:
    templates: [QuickLookExtension]
    sources:
      - Sources/TablePreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lixinlv.PreAnything.TablePreview
        PRODUCT_NAME: Table Preview
    info:
      path: Sources/TablePreview/Info.plist
      properties:
        CFBundleDisplayName: Table Preview
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "14"
        PreAnythingAppGroupIdentifier: $(PREANYTHING_APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - public.comma-separated-values-text
              - public.tab-separated-values-text
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false

  XMLPreview:
    templates: [QuickLookExtension]
    sources:
      - Sources/XMLPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lixinlv.PreAnything.XMLPreview
        PRODUCT_NAME: XML Preview
    info:
      path: Sources/XMLPreview/Info.plist
      properties:
        CFBundleDisplayName: XML Preview
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "14"
        PreAnythingAppGroupIdentifier: $(PREANYTHING_APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [public.xml]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false

  NotebookPreview:
    templates: [QuickLookExtension]
    sources:
      - Sources/NotebookPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lixinlv.PreAnything.NotebookPreview
        PRODUCT_NAME: Notebook Preview
    info:
      path: Sources/NotebookPreview/Info.plist
      properties:
        CFBundleDisplayName: Notebook Preview
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "14"
        PreAnythingAppGroupIdentifier: $(PREANYTHING_APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.lixinlv.preanything.notebook]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false

  PreviewKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PreviewKitTests
    dependencies:
      - target: PreviewKit
      - package: SwiftMath
      - package: TOMLKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lixinlv.PreAnything.PreviewKitTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

targetTemplates:
  QuickLookExtension:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    entitlements:
      path: Config/QuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(PREANYTHING_APP_GROUP_IDENTIFIER)
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: PreviewKit
      - sdk: AppKit.framework
      - sdk: Quartz.framework

schemes:
  PreAnything:
    build:
      targets:
        PreAnything: all
        PreviewKitTests: [test]
    test:
      targets:
        - PreviewKitTests
    run:
      config: Debug
    archive:
      config: Release
